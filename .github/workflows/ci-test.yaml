name: CI Pipeline

on:
  push:
    branches:
      - '*'  # Run on all branches
    tags:
      - '*'  # Run on tags
  #workflow_dispatch:
  #schedule:
  #  - cron: '0 0 * * *'  # Schedule for daily runs, adjust as needed

env:
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Registry
        env:
          DOCKER_USERNAME: ${{ secrets.CI_REGISTRY_USER }}
          DOCKER_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
        run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin "${{ secrets.CI_REGISTRY }}"

      - name: Set Tags Based on Branch or Tag
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "branch" ]]; then
            if [[ "${{ github.ref }}" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
              echo "SPECIFIC_TAG=candidate-${{ github.sha::8 }}" >> $GITHUB_ENV
              echo "LATEST_TAG=candidate-latest" >> $GITHUB_ENV
            else
              echo "SPECIFIC_TAG=${{ github.ref_name }}-${{ github.sha::8 }}" >> $GITHUB_ENV
              echo "LATEST_TAG=${{ github.ref_name }}-latest" >> $GITHUB_ENV
            fi
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            echo "SPECIFIC_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "LATEST_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Build and Push Docker Image
        env:
          SPECIFIC_TAG: ${{ env.SPECIFIC_TAG }}
          LATEST_TAG: ${{ env.LATEST_TAG }}
        run: |
          docker buildx create --platform $IMAGE_PLATFORMS --name ci-build --use
          docker buildx build --push --platform $IMAGE_PLATFORMS \
            -t ${{ secrets.CI_REGISTRY_IMAGE }}:${SPECIFIC_TAG} \
            -t ${{ secrets.CI_REGISTRY_IMAGE }}:${LATEST_TAG} \
            -f ${{ env.DOCKERFILE_DIR || '.' }}/${{ env.DOCKERFILE || 'Dockerfile' }} \
            ${{ env.DOCKERFILE_DIR || '.' }}

  docker-deploy:
    name: Deploy Docker Container
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Install SSH Client
        run: sudo apt-get install -y openssh-client

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host art-portal-host\n\tHostName cs1msa.iee.ihu.gr\n\tUser $SSH_USER\n\tIdentityFile ~/.ssh/id_rsa\n\tStrictHostKeyChecking no" > ~/.ssh/config

      - name: Deploy Docker Container on Remote
        env:
          CI_REGISTRY_IMAGE: ${{ secrets.CI_REGISTRY_IMAGE }}
          SPECIFIC_TAG: ${{ env.SPECIFIC_TAG }}
        run: |
          ssh art-portal-host "docker run -d -p 80:80 ${CI_REGISTRY_IMAGE}:${SPECIFIC_TAG}"
